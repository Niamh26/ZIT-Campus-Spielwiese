name: Deploy ZIT Spielwiese with skull models
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 22 BodyParts3D skull bones
        shell: bash
        run: |
          set -euo pipefail
          dir="games/schaedel-puzzle/models"
          mkdir -p "$dir"
          base="https://raw.githubusercontent.com/Kevin-Mattheus-Moerman/BodyParts3D/main/assets/BodyParts3D_data/stl"
          ids=(FMA52734 FMA52735 FMA52736 FMA52738 FMA52739 FMA52740 FMA52748 FMA52788 FMA52789 FMA52892 FMA52893 FMA53645 FMA53646 FMA53647 FMA53648 FMA53649 FMA53650 FMA53655 FMA53656 FMA9710 FMA54737 FMA54738)
          for id in "${ids[@]}"; do
            curl --fail --location --retry 3 "$base/$id.stl" -o "$dir/$id.stl"
          done
          test "$(find "$dir" -name '*.stl' | wc -l)" -eq 22
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
