<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIT Campus Spielwiese starten</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;max-width:760px;margin:70px auto;padding:24px;color:#19302b}h1{color:#2f7f16}a{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:12px;background:#f28c00;color:#fff;text-decoration:none;font-weight:750}.box{padding:22px;border:1px solid #d7e5cf;border-radius:18px;background:#f8fbf5;line-height:1.65}.warn{color:#a04e00;font-weight:700}</style></head><body><h1>ZIT Campus Spielwiese</h1><div class="box"><p><strong>Wichtig:</strong> Bitte die ZIP-Datei zuerst vollständig entpacken.</p><p>Öffne danach im entpackten Ordner diese Datei erneut oder direkt <code>index.html</code>.</p><p id="warning"></p><a id="start" href="index.html">Spielwiese öffnen</a></div><script>const p=decodeURIComponent(location.href);if(/\.zip|AppData\/Local\/Temp|AppData\\Local\\Temp/i.test(p)){document.getElementById('warning').className='warn';document.getElementById('warning').textContent='Die Datei läuft gerade noch aus dem ZIP-/Temp-Ordner. Bitte zuerst Rechtsklick auf die ZIP-Datei → „Alle extrahieren…“.';document.getElementById('start').style.display='none';}</script></body></html>
