<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIT Campus Spielwiese</title>
<style>
:root{--green:#2f7f16;--light:#f5faef;--orange:#f28c00;--ink:#19302b;--muted:#61706a;--line:#d7e5cf}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.header{border-bottom:1px solid #e8eee4}
.header-inner{max-width:1280px;margin:auto;padding:12px 22px 18px;display:flex;align-items:center;gap:24px}
.logo{width:165px;height:auto;flex:0 0 auto}
h1{font-size:clamp(2rem,5vw,4.1rem);line-height:1.05;margin:0;color:var(--green);letter-spacing:-.04em}
.subtitle{font-size:1.15rem;color:var(--muted);margin-top:7px}
main{max-width:1280px;margin:auto;padding:48px 22px 50px}
.intro{display:grid;grid-template-columns:1.3fr .9fr;gap:50px;align-items:end;margin-bottom:28px}
.eyebrow{font-size:.83rem;font-weight:800;letter-spacing:.13em;color:var(--orange);margin-bottom:12px}
h2{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.15;margin:0}
.intro p{font-size:1.15rem;line-height:1.7;color:var(--muted);margin:0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));grid-auto-rows:1fr;gap:22px}
.game{border:1px solid var(--line);border-radius:28px;padding:30px;min-height:285px;height:100%;display:grid;grid-template-columns:70px 1fr;gap:22px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;background:#fff}
.game.available{cursor:pointer}
.game.available:hover{transform:translateY(-5px);border-color:#bfd8b2;box-shadow:0 18px 42px rgba(51,95,27,.13)}
.icon{width:70px;height:70px;border-radius:22px;background:var(--light);display:grid;place-items:center;font-size:2rem}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#f1f4f0;color:#5f6e66;font-size:.85rem;font-weight:700}
.available .badge{background:#eaf7df;color:#2f7616}
.game h3{font-size:1.5rem;color:var(--green);margin:24px 0 12px}
.game p{color:var(--muted);font-size:1.05rem;line-height:1.65;margin:0}
.start{display:inline-flex;align-items:center;justify-content:center;margin-top:28px;background:var(--orange);color:#fff;font-weight:800;text-decoration:none;padding:12px 18px;border-radius:12px;box-shadow:0 7px 18px rgba(242,140,0,.18);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.start:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,140,0,.26);background:#dc7e00}
.game>div:last-child{display:flex;flex-direction:column;align-items:flex-start}
.game p{flex:1}
.footer{text-align:center;margin-top:44px}
.skool{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:13px 21px;border-radius:12px;font-weight:750}
@media(max-width:760px){
 .header-inner{flex-direction:column;text-align:center;gap:6px;padding-top:12px;padding-bottom:16px}
 .logo{width:132px}
 main{padding-top:34px}
 .intro{grid-template-columns:1fr;gap:18px}
 .games{grid-template-columns:1fr}
 .game{padding:24px;grid-template-columns:58px 1fr;min-height:250px}
 .icon{width:58px;height:58px}
}
</style>
</head>
